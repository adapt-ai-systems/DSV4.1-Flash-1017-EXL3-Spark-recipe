[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsv41-exl3-shim"
version = "0.1.0"
description = "Minimal DeepSeek-V4.1 <-> vllm-exl3 quant-config shim (no vLLM source changes)"
requires-python = ">=3.12"

[project.entry-points."vllm.general_plugins"]
dsv41_exl3_shim = "dsv41_exl3_shim:register"

[tool.setuptools]
packages = ["dsv41_exl3_shim"]